[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seif-pii"
version = "1.0.0"
description = "СЕЙФ — reversible personal data gateway"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.53.0", "cryptography==50.0.1", "redis==8.1.0", "PyYAML==6.0.3", "regex==2026.9.10", "prometheus-client==0.26.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "aiohttp==3.14.3", "ruff==0.16.8"]

[tool.setuptools.packages.find]
include = ["seif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C901", "C4", "SIM", "PERF", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "S"]

# Pytest assertions and fixed, local-only fixture credentials are intentional.
# The isolated archive analyzer still reports every finding from these rules.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# These regression tests execute fixed local programs without a shell.
"tests/test_field_adversarial.py" = ["S603"]
"tests/test_transform_review.py" = ["S603"]
"tests/test_sentinel.py" = ["S603"]
# Local operator tools intentionally execute validated argv, with shell=False.
"scripts/code_quality.py" = ["S603"]
"scripts/local_redis.py" = ["S603"]
"scripts/failover_check.py" = ["S603"]
"deploy/k8s/create-secrets.py" = ["S603"]
# Seeded shuffling determines benchmark order, never credentials or identifiers.
"scripts/compare_presidio.py" = ["S311"]
"scripts/benchmark_corpus.py" = ["S311"]
