apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app.kubernetes.io/name: seif-redis
    app.kubernetes.io/part-of: seif
spec:
  clusterIP: None
  # Discovery must work before readiness and before the first primary starts.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: seif-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: seif-redis
    app.kubernetes.io/part-of: seif
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: seif-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seif-redis
        app.kubernetes.io/part-of: seif
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: seif-redis
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: seif-redis
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /config/start-redis.sh]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_DOMAIN
              value: cluster.local
            - name: MASTER_NAME
              value: seif-master
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seif-secrets
                  key: redis-password
            - name: MIN_REPLICAS_TO_WRITE
              value: "1"
            - name: MIN_REPLICAS_MAX_LAG
              value: "5"
            - name: REDIS_MAXMEMORY
              value: 1gb
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            exec:
              command: [/bin/sh, /config/health.sh, redis-live]
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [/bin/sh, /config/health.sh, redis-ready]
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/bin/sh, /config/health.sh, redis-live]
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, 'export REDISCLI_AUTH="$REDIS_PASSWORD"; timeout 20 redis-cli -h 127.0.0.1 -p 6379 SHUTDOWN || true']
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: sentinel
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /config/start-sentinel.sh]
          ports:
            - name: sentinel
              containerPort: 26379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_DOMAIN
              value: cluster.local
            - name: MASTER_NAME
              value: seif-master
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seif-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            exec:
              command: [/bin/sh, /config/health.sh, sentinel-live]
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [/bin/sh, /config/health.sh, sentinel-ready]
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/bin/sh, /config/health.sh, sentinel-live]
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /config
              readOnly: true
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: redis-scripts
            defaultMode: 0555
        - name: bootstrap
          configMap:
            name: redis-bootstrap
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seif-redis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seif-redis
