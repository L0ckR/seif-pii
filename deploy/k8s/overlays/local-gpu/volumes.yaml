  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [seif-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seif-capture
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: seif-local-capture
  resources:
    requests:
      storage: 10Gi
