global
    maxconn "${SEIF_NER_PROXY_MAXCONN}"
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 25s
    timeout server 20s
    timeout http-request 5s
    timeout http-keep-alive 5s
    timeout queue 100ms
    retries 0

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend private_ner
    bind :8770
    default_backend ner_workers

backend ner_workers
    balance leastconn
    no option prefer-last-server
    http-reuse safe
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host ner hdr Authorization "Bearer ${SEIF_NER_TOKEN}"
    http-check expect status 200
    # Connection and model admission bounds agree; probes do not enqueue model jobs.
    # Global maxconn also counts idle API pool connections; keep room for probes.
    # The queue wait is bounded at 100 ms, even when frontend capacity increases.
    default-server inter 3s fall 3 rise 2 maxconn "${SEIF_NER_MAX_MODEL_JOBS}" maxqueue 32
    server ner-1 ner-1:8770 check resolvers docker init-addr libc,none
    server ner-2 ner-2:8770 check resolvers docker init-addr libc,none
