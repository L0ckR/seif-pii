global
    maxconn 1024
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 35s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 250ms
    retries 0

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend loopback_gateway
    bind :8000
    # Ignore any caller-supplied forwarding claim at this ingress.
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    default_backend api_workers

backend api_workers
    balance leastconn
    no option prefer-last-server
    http-reuse safe
    option httpchk GET /health
    http-check expect status 200
    # This is per API container, which may contain multiple Uvicorn workers.
    default-server inter 5s fall 3 rise 2 maxconn "${SEIF_API_PROXY_MAXCONN}" maxqueue 128
    server api-1 api-1:8000 check resolvers docker init-addr libc,none
    server api-2 api-2:8000 check resolvers docker init-addr libc,none
