<rect x="64" y="713" width="1006" height="72" rx="2" fill="#17231d" stroke="#334138" stroke-width="1.2"/>
<text x="88" y="743" fill="#f0f0df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Выполнение: правила → NER → объединение → политика.</text>
<text x="88" y="770" fill="#eab291" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Ошибка или таймаут включённого NER → 503; частичный результат не выдаётся.</text>
<text x="64" y="826" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Одна и та же политика на всех датасетах. NER дополняет правила; числовые и контекстные проверки сохраняются.</text>
