<text x="1161" y="310" fill="#f0f0df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" text-anchor="start">Контекст + политика</text>
<text x="1161" y="352" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">валидация типа и координат</text>
<text x="1161" y="386" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">приоритеты и пересечения</text>
<text x="1161" y="420" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">разрешённые tenant-типы</text>
<text x="1161" y="454" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">упорядоченные spans</text>
