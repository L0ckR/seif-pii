<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide5-title slide5-desc"><title id="slide5-title">Детекция: правила и RuBERT в одном контракте</title><desc id="slide5-desc">RuBERT экспериментальный профиль. Исходный Unicode-текст без нормализации поступает в правила, затем в опциональный private NER. 21 нативный тип модели отображается в 14 транспортных типов без изменения исходных границ. Контекстное объединение и политика выбирают spans, затем применяются mask, token или synthetic. Ошибка NER завершает запрос 503.</desc>
<defs><marker id="slide5-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#c0f0c5" stroke-width="1.5"/></marker><marker id="slide5-arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#eab291" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="2" fill="#111b17"/>
