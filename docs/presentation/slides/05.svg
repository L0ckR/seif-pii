<text x="1161" y="760" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">выход: защищённый текст + замены</text>
<path d="M 1337 514 V 625" fill="none" stroke="#c0f0c5" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#slide5-arrow)"/>
