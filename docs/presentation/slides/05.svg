<text x="407" y="536" fill="#f0f0df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">RuBERT / TensorRT</text>
<text x="407" y="570" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">FP16 · word decoder</text>
<text x="407" y="598" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">21 нативный тип</text>
<rect x="760" y="498" width="310" height="166" rx="2" fill="#1c2a22" stroke="#334138" stroke-width="1.2"/>
