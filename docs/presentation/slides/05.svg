<text x="784" y="570" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">ФИО → PERSON</text>
<text x="784" y="598" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">адрес → LOCATION</text>
<text x="784" y="626" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">границы сохраняются</text>
