<text x="407" y="274" fill="#f0f0df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Правила РФ / СНГ</text>
<text x="407" y="308" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">формат и проверки сумм</text>
<text x="407" y="336" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">контекст и типы документов</text>
<rect x="383" y="498" width="310" height="166" rx="2" fill="#1c2a22" stroke="#c0f0c5" stroke-width="1.2" stroke-dasharray="7 6"/>
