<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide3-title slide3-desc"><title id="slide3-title">Защита данных до обращения к LLM</title><desc id="slide3-desc">Логическая архитектура SEIF: приложение вызывает API, правила и опциональный NER, контекстное объединение и политику, трансформацию, зашифрованное хранилище. Только приложение вызывает внешнюю LLM. Показан путь нового payload_id; повторный запрос может вернуть сохранённый результат.</desc>
