<text x="64" y="147" fill="#93a397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Путь нового payload_id. Повтор исходного запроса может вернуть сохранённый результат.</text>
