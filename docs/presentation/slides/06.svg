<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="slide6-title slide6-desc"><title id="slide6-title">Один сервис. Несколько профилей размещения.</title><desc id="slide6-desc">Слева базовый Docker Compose: один API и Redis, опциональный CPU NER; GPU RuBERT работает отдельным процессом. Справа подготовленные Kubernetes манифесты: API 3 реплики и HPA 2–8, опциональный CPU NER 2 реплики, три Redis/Sentinel pod. Схема не утверждает наличие работающего кластера.</desc>
