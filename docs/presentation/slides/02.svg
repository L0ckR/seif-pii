<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Удачная основа. Чёткие границы роста."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111b17" stroke="none" stroke-width="1" opacity="1"/><line x1="64" y1="90" x2="1536" y2="90" stroke="#334138" stroke-width="1"/><rect x="65" y="34" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="82" y="34" width="12" height="12" rx="0" fill="#c0f0c5" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="65" y="51" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="82" y="51" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><text x="111" y="62" font-size="31" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="600" font-style="normal" text-anchor="start" fill="#f0f0df">СЕЙФ</text><text x="286" y="58" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397">01 / АРХИТЕКТУРНАЯ ОЦЕНКА</text><text x="1536" y="58" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="end" fill="#93a397">23.09.2026</text><text x="64" y="173" font-size="58" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="1472">Удачная основа. Чёткие границы роста.</text><text x="64" y="232.0" font-size="27" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="1472">Сильный демо-прокси; для пилота важнее закрыть измеримые пробелы, чем добавлять сервисы.</text><rect x="64" y="292" width="468" height="375" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="92" y="336" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">01 / РАЗДЕЛЕНИЕ</text><text x="92" y="397" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">Логика по границам</text><text x="92" y="450" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">API и правила — отдельно от NER.</text><text x="92" y="486" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Хранилище — вне модели.</text><text x="92" y="522" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">LLM вызывает потребитель.</text><text x="92" y="558" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Профили можно менять явно.</text><rect x="554" y="292" width="468" height="375" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="582" y="336" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">02 / КОНТРОЛЬ</text><text x="582" y="397" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">Прозрачные решения</text><text x="582" y="450" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Политика на потребителя.</text><text x="582" y="486" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Причины и Unicode-диапазоны.</text><text x="582" y="522" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Ошибка NER не скрывается.</text><text x="582" y="558" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Восстановление проверяется.</text><rect x="1044" y="292" width="492" height="375" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="1072" y="336" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#eab291">03 / ОГРАНИЧЕНИЯ</text><text x="1072" y="397" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="436">Нужен следующий шаг</text><text x="1072" y="450" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">NER ограничивает GPU-профиль.</text><text x="1072" y="486" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">Границы сущностей неточны.</text><text x="1072" y="522" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">Golden уже изучен разработкой.</text><text x="1072" y="558" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">HA задана конфигурацией,</text><text x="1072" y="594" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">но не доказывает zero-RPO.</text><text x="64" y="755" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">ВЕРДИКТ</text><text x="232" y="761" font-size="31" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="1300">Развивать текущую модульную схему и измерять каждое изменение.</text><line x1="64" y1="830" x2="1536" y2="830" stroke="#334138" stroke-width="1"/><text x="64" y="866" font-size="15" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="1350">Оценка по исходникам · подробные доказательства: architecture-assessment.md</text><text x="1536" y="866" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="end" fill="#93a397">02 / 16</text></svg>