<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Следующий шаг — измеримый пилот."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111b17" stroke="none" stroke-width="1" opacity="1"/><line x1="64" y1="90" x2="1536" y2="90" stroke="#334138" stroke-width="1"/><rect x="65" y="34" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="82" y="34" width="12" height="12" rx="0" fill="#c0f0c5" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="65" y="51" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><rect x="82" y="51" width="12" height="12" rx="0" fill="#111b17" stroke="#c0f0c5" stroke-width="1.8" opacity="1"/><text x="111" y="62" font-size="31" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="600" font-style="normal" text-anchor="start" fill="#f0f0df">СЕЙФ</text><text x="286" y="58" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397">08 / ПЛАН РАЗВИТИЯ</text><text x="1536" y="58" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="end" fill="#93a397">23.09.2026</text><text x="64" y="173" font-size="58" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="1472">Следующий шаг — измеримый пилот.</text><rect x="64" y="275" width="468" height="414" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="92" y="319" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">01 / КАЧЕСТВО</text><text x="92" y="380" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">Независимая</text><text x="92" y="422" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">проверка</text><text x="92" y="483" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Holdout с ручной разметкой.</text><text x="92" y="519" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Mask F1, exact F1, recall типов.</text><text x="92" y="555" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Отдельная проверка РФ и СНГ.</text><text x="92" y="591" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Сборка ФИО для synthetic.</text><rect x="554" y="275" width="468" height="414" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="582" y="319" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">02 / СКОРОСТЬ</text><text x="582" y="380" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">GPU-профиль</text><text x="582" y="422" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="412">под нагрузкой</text><text x="582" y="483" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Длинные тексты, mixed workload.</text><text x="582" y="519" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Очередь и batching — абляции.</text><text x="582" y="555" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">p95 / p99 и доля ошибок.</text><text x="582" y="591" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="412">Повторные прогоны без кэша.</text><rect x="1044" y="275" width="492" height="414" rx="0" fill="#17231d" stroke="#334138" stroke-width="1" opacity="1"/><text x="1072" y="319" font-size="17" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5">03 / ПИЛОТ</text><text x="1072" y="380" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="436">Рабочий контур</text><text x="1072" y="422" font-size="34" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#f0f0df" data-max-width="436">и эксплуатация</text><text x="1072" y="483" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">Секреты, ingress/TLS и права.</text><text x="1072" y="519" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">Retention capture и rotation ключей.</text><text x="1072" y="555" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">Восстановление после сбоев.</text><text x="1072" y="591" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="436">SLO и владелец реакции на ошибки.</text><text x="64" y="763" font-size="25" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#c0f0c5" data-max-width="1472">Критерий успеха: качество, обратимость и latency сохраняются на новых данных и при отказах.</text><line x1="64" y1="830" x2="1536" y2="830" stroke="#334138" stroke-width="1"/><text x="64" y="866" font-size="15" font-family="Segoe UI, Arial, DejaVu Sans, sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#93a397" data-max-width="1350">Предложения по развитию · критерии приёмки нужно согласовать с владельцем пилота</text><text x="1536" y="866" font-size="16" font-family="Consolas, DejaVu Sans Mono, monospace" font-weight="400" font-style="normal" text-anchor="end" fill="#93a397">13 / 16</text></svg>