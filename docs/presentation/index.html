const notes=["Архитектура сервиса и экспериментального GPU-профиля. Числа взяты из сохранённых отчётов; новые нагрузочные или модельные эксперименты для этой презентации не запускались.", "Это качественная архитектурная оценка, не численный рейтинг и не подтверждение production SLA. Критерии хакатона оценивают демонстрационный прокси, а не завершённую production-платформу.", "Схема нового payload_id. При повторе запрос может обслуживаться из зашифрованного vault без повторного NER. Внешний LLM не вызывается сервером СЕЙФ: его оркестрирует потребитель. Это граница маршрутизации, а не гарантия безошибочного распознавания.", "Token допускает повторение и перестановку известных токенов в новом окружении. Mask/synthetic требуют точный защищённый результат. Восстановление ограничено tenant, payload_id, политикой и временем жизни записи.", "Сохраняются исходные Unicode code-point offsets. 21 native-категория RuBERT отображается в 14 транспортных типов; это не количество всех типов правил. Ошибка настроенного NER завершает запрос ошибкой, а не успешным неполным результатом.", "Базовый Compose, optional CPU NER и отдельный экспериментальный GPU-процесс не являются одним одинаково измеренным стендом. K8s-манифесты подготовлены; наличие yaml не доказывает работающий production-кластер. GPU-образ и GPU-оркестрация отдельно не реализованы.", "Сервис поддерживает allowlist потребителей, ключи API, перечни типов, комбинации типов, custom rules и отдельное разрешение восстановления. Capture исходных текстов — самостоятельная опция: его файлы не защищены шифрованием и TTL vault автоматически.", "Это сравнение сервисных конфигураций, а не чистый рейтинг моделей: контракты и версии правил различаются. spaCy и GLiNER пересчитаны на текущих правилах по сохранённым предсказаниям. GLiNER обученному декодеру передавали person/location и конкурирующий organization; другие PII-классы не запрашивались. Строгая проверка предобработки 5 095 текстов не выявила ошибки выравнивания. LFM указан с address-proxy; его native hybrid с 40 типами показан отдельно. Organizer размечен ИИ, а все корпуса уже изучались в разработке.", "F1 считается по закрытым буквам и цифрам независимо от типа и точных границ. pii-guard — pinned raw-text ablation: правила, word-decoder и merge, без normalize/translit/base64. Это не воспроизведение его опубликованного model-card score.", "Mask F1 выше raw-text pii-guard на RMR, но recall ниже: 90,8026% против 92,7205%. Exact common14 остаётся ниже: 86,7601% против 89,8458%. Common14 исключает внеобластные предсказания: 19 у СЕЙФ и 253 у guard. Без этих исключений exact F1 равен 86,6113% и 87,8188%. Из 801 strict FN: 386 — правильный тип, но другие границы; 60 — другой тип; 91 — частичное покрытие; 264 — не защищены. На organizer и PII exact-span снизился из-за разделения на компоненты. Сохранение маски не отменяет эту регрессию.", "Группы имеют разные условия и не доказывают кратного ускорения от одной смены модели. GLiNER: 446 запросов маскирования, C4; RuBERT: 22 300, C8. Один API-worker, один NER-worker, память вместо Redis, loopback, реальная модель, capture отключён. GLiNER RPS относится к историческому сервису: после нового CPU replay нагрузка не запускалась. Эти результаты не подтверждают SLA 1 000 RPS для GPU-профиля. У LFM HTTP не измерялся; скорость модели в texts/s нельзя выдавать за HTTP RPS.", "Это предложения, а не изменения сервиса в рамках презентации. Тело запроса ограничено по размеру и времени, но авторизация API выполняется после чтения и разбора JSON. В одном NER-процессе модель исполняется последовательно; CPU-HPA API не решает перегрузку GPU. Асинхронная репликация Redis требует согласования допустимой потери последних записей. Raw capture хранится отдельно от шифрования и TTL vault.", "Приоритет — независимый holdout и совместная проверка маскирования, точных границ и типов. Следующий корректный эксперимент GLiNER требует одинакового с RuBERT перечня PII-классов и нового запуска модели. Batching и реплики нужно оценивать по очереди, latency и смешанной нагрузке. До пилота отдельно проверяются отказ компонентов, восстановление и ротация ключей.", "Сценарий отражает критерии хакатона: контекст, маскирование, восстановление, настройка политики и метрики. Используйте вымышленные данные, текущий профиль и фактический ответ API. Токен на слайде схематический: модель может выделить несколько компонентов ФИО. Не выдавайте экспериментальный GPU-профиль за уже развёрнутый публичный сервис.", "Рекомендация — сохранить текущие модульные границы и сосредоточиться на объединении сущностей, точных границах и независимом holdout. Полного превосходства над pii-guard нет. 533,74 RPS — локальное измерение конкретного GPU-профиля. 3 119 — ранее прошедшие основные тесты; ещё 161 проверка выполнена в модельном окружении, а 35 основных тестов пропущены из-за опциональных зависимостей и локальных сервисов.", "Архитектура проверена по коммиту 15eea67. Для чисел сохранены пути отчётов, JSON pointers и SHA256. Повторная проверка GLiNER сохраняет тот же состав 5 095 текстов и версии runtime. PDF критериев хакатона использованы как контекст презентации. Исходные тексты датасетов и секреты в материалы не переносились."];
const slides=[...document.querySelectorAll('.slide')];let index=0;
const byId=id=>document.getElementById(id);
function show(i,updateHash=true){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('is-active',j===index));byId('select').value=String(index);byId('counter').textContent=`${String(index+1).padStart(2,'0')} / ${slides.length}`;byId('prev').disabled=index===0;byId('next').disabled=index===slides.length-1;byId('notesText').textContent=notes[index];byId('progress').style.width=`${(index+1)/slides.length*100}%`;if(updateHash)history.replaceState(null,'',`#slide-${index+1}`);document.title=`${index+1}. ${slides[index].getAttribute('aria-label')} — СЕЙФ`}
function grid(){const active=document.body.classList.toggle('grid-mode');byId('grid').setAttribute('aria-pressed',String(active));if(!active)window.scrollTo(0,0)}
function toggleNotes(){byId('notes').hidden=!byId('notes').hidden;byId('notesButton').setAttribute('aria-pressed',String(!byId('notes').hidden))}
async function fullscreen(){if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}
byId('prev').onclick=()=>show(index-1);byId('next').onclick=()=>show(index+1);byId('select').onchange=e=>show(Number(e.target.value));byId('grid').onclick=grid;byId('notesButton').onclick=toggleNotes;byId('fullscreen').onclick=()=>fullscreen().catch(()=>{});
slides.forEach((s,i)=>s.addEventListener('click',()=>{if(document.body.classList.contains('grid-mode')){grid();show(i)}}));
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(slides.length-1)}else if(e.key.toLowerCase()==='g'){grid()}else if(e.key.toLowerCase()==='n'){toggleNotes()}else if(e.key.toLowerCase()==='f'){fullscreen().catch(()=>{})}else if(e.key==='Escape'){byId('notes').hidden=true;byId('notesButton').setAttribute('aria-pressed','false');if(document.body.classList.contains('grid-mode'))grid()}});
window.addEventListener('hashchange',()=>show(Math.max(0,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1),false));
show(Math.max(0,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1),false);
</script></body></html>
