<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111b17'/%3E%3Cpath d='M6 6h8v8H6zM18 6h8v8h-8zM6 18h8v8H6zM18 18h8v8h-8z' stroke='%23c0f0c5' fill='none'/%3E%3C/svg%3E"><title>СЕЙФ — архитектура и эксперименты</title>
<style>
:root{color-scheme:dark;--bg:#111b17;--ink:#f0f0df;--muted:#93a397;--mint:#c0f0c5;--border:#334138}*{box-sizing:border-box}body{margin:0;background:#0c140f;color:var(--ink);font:14px 'Segoe UI',Arial,sans-serif}button,select,a{font:inherit;color:inherit}button,select{background:var(--bg);border:1px solid var(--border);padding:9px 14px;cursor:pointer}button:hover,a:hover{color:var(--mint);border-color:var(--mint)}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:disabled{opacity:.35;cursor:default}button[aria-pressed=true]{background:#304b36;border-color:var(--mint)}.toolbar{height:62px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border)}.toolbar strong{font-weight:600;letter-spacing:.08em;color:var(--mint);margin-right:12px}.toolbar select{max-width:560px;flex:1;min-width:150px}.downloads{margin-left:auto;display:flex;gap:16px}.downloads a{font-size:12px;text-decoration:none;border-bottom:1px solid var(--border);padding:7px 0}.stage{width:min(calc(100vw - 40px),calc((100vh - 124px)*16/9));aspect-ratio:16/9;margin:18px auto 0;box-shadow:0 15px 80px #0005}.slide{width:100%;height:100%;display:none;background:var(--bg)}.slide.is-active{display:block}.slide>svg{display:block;width:100%;height:100%}.controls{height:42px;display:flex;gap:18px;align-items:center;justify-content:center;color:var(--muted);font-size:12px}.controls kbd{font:11px Consolas,monospace;border:1px solid var(--border);padding:2px 5px;margin-right:4px}.counter{min-width:72px;text-align:center;font-family:Consolas,monospace;color:var(--mint)}.progress{position:fixed;bottom:0;left:0;height:3px;background:var(--mint);transition:width .18s}.notes{position:fixed;bottom:55px;right:32px;width:min(650px,calc(100vw - 64px));padding:25px;background:#1c2a22;border:1px solid #506e51;box-shadow:0 8px 35px #0008;line-height:1.7;font-size:17px;z-index:10}.notes h2{font:12px Consolas,monospace;color:var(--mint);letter-spacing:.12em;margin:0 0 12px}.notes p{margin:0}.notes[hidden]{display:none}.grid-mode .stage{width:calc(100% - 48px);height:auto;aspect-ratio:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px}.grid-mode .slide{display:block;aspect-ratio:16/9;cursor:pointer;border:1px solid var(--border);transition:transform .15s}.grid-mode .slide:hover{transform:translateY(-3px);border-color:var(--mint)}.grid-mode .slide.is-active{outline:2px solid var(--mint)}.grid-mode .controls{height:60px}.grid-mode .notes{display:none}body:fullscreen{background:var(--bg)}body:fullscreen .stage{width:min(100vw,calc((100vh - 50px)*16/9));margin-top:0;box-shadow:none}body:fullscreen .toolbar{display:none}body:fullscreen .controls{height:50px}body:fullscreen .grid-mode{background:var(--bg)}@media(max-width:800px){.toolbar{padding:0 12px;gap:7px}.toolbar strong{display:none}.toolbar button{padding:9px}.downloads a{font-size:10px}.downloads{gap:9px}.stage{width:100vw;margin-top:20px}.controls .hint{display:none}.grid-mode .stage{grid-template-columns:1fr;margin:15px;width:calc(100% - 30px)}}@media print{@page{size:1600px 900px;margin:0}html,body{margin:0!important;padding:0!important;background:var(--bg);print-color-adjust:exact;-webkit-print-color-adjust:exact}.toolbar,.controls,.progress,.notes{display:none!important}.stage,.grid-mode .stage{display:block!important;width:1600px!important;height:auto!important;margin:0!important;box-shadow:none!important}.slide,.slide.is-active,.grid-mode .slide{display:block!important;width:1600px!important;height:900px!important;margin:0!important;border:0!important;outline:0!important;break-after:page;page-break-after:always;transform:none!important}.slide:last-child{break-after:auto;page-break-after:auto}.slide>svg{width:1600px!important;height:900px!important}}
</style></head><body>
<header class="toolbar"><strong>СЕЙФ / DECK</strong><button id="prev" aria-label="Предыдущий слайд">←</button><select id="select" aria-label="Перейти к слайду">@@OPTIONS@@</select><button id="next" aria-label="Следующий слайд">→</button><button id="grid" aria-pressed="false" title="Все слайды (G)">Обзор</button><button id="notesButton" aria-pressed="false" title="Заметки докладчика (N)">Заметки</button><button id="fullscreen" title="Полный экран (F)">⛶</button><nav class="downloads" aria-label="Файлы презентации"><a href="seif-architecture.pdf" download>PDF ↓</a><a href="seif-architecture.pptx" download>PPTX ↓</a></nav></header>
<main class="stage" id="stage">@@SLIDES@@</main>
<aside class="notes" id="notes" hidden><h2>ЗАМЕТКИ ДОКЛАДЧИКА</h2><p id="notesText"></p></aside>
<footer class="controls"><span class="hint"><kbd>←</kbd><kbd>→</kbd> листать</span><span class="counter" id="counter" aria-live="polite"></span><span class="hint"><kbd>F</kbd> полный экран · <kbd>G</kbd> обзор · <kbd>N</kbd> заметки</span></footer><div class="progress" id="progress"></div>
<script>
const notes=@@NOTES@@;
const slides=[...document.querySelectorAll('.slide')];let index=0;
const byId=id=>document.getElementById(id);
function show(i,updateHash=true){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('is-active',j===index));byId('select').value=String(index);byId('counter').textContent=`${String(index+1).padStart(2,'0')} / ${slides.length}`;byId('prev').disabled=index===0;byId('next').disabled=index===slides.length-1;byId('notesText').textContent=notes[index];byId('progress').style.width=`${(index+1)/slides.length*100}%`;if(updateHash)history.replaceState(null,'',`#slide-${index+1}`);document.title=`${index+1}. ${slides[index].getAttribute('aria-label')} — СЕЙФ`}
function grid(){const active=document.body.classList.toggle('grid-mode');byId('grid').setAttribute('aria-pressed',String(active));if(!active)window.scrollTo(0,0)}
function toggleNotes(){byId('notes').hidden=!byId('notes').hidden;byId('notesButton').setAttribute('aria-pressed',String(!byId('notes').hidden))}
async function fullscreen(){if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}
byId('prev').onclick=()=>show(index-1);byId('next').onclick=()=>show(index+1);byId('select').onchange=e=>show(Number(e.target.value));byId('grid').onclick=grid;byId('notesButton').onclick=toggleNotes;byId('fullscreen').onclick=()=>fullscreen().catch(()=>{});
slides.forEach((s,i)=>s.addEventListener('click',()=>{if(document.body.classList.contains('grid-mode')){grid();show(i)}}));
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(slides.length-1)}else if(e.key.toLowerCase()==='g'){grid()}else if(e.key.toLowerCase()==='n'){toggleNotes()}else if(e.key.toLowerCase()==='f'){fullscreen().catch(()=>{})}else if(e.key==='Escape'){byId('notes').hidden=true;byId('notesButton').setAttribute('aria-pressed','false');if(document.body.classList.contains('grid-mode'))grid()}});
window.addEventListener('hashchange',()=>show(Math.max(0,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1),false));
show(Math.max(0,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1),false);
</script></body></html>
